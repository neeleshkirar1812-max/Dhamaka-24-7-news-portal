databases:
  - name: dhamaka24x7-db
    databaseName: dhamaka24x7
    user: dhamaka24x7_user
    plan: free

services:
  - type: web
    name: dhamaka24x7-news
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run render-build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: dhamaka24x7-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@newsportal.in
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-sonnet-5-5
      - key: AI_PROVIDER
        value: auto
      - key: AI_DAILY_LIMIT
        value: "200"
      - key: ADSENSE_CLIENT_ID
        sync: false
      - key: STORAGE_PROVIDER
        value: local
